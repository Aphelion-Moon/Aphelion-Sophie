<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Shuttle · Not boarding yet</title>
<style>
@font-face { font-family: Cozette; src: url(/fonts/CozetteVector.woff2) format('woff2'); font-display: swap; }
:root { color-scheme: dark; --ink: #14130f; --ivory: #e8dfc6; --dim: #a59e88; --amber: #ffb84d; --holo: #72e6ff; --rule: #38352a; }
html, body { height: 100%; margin: 0; background: var(--ink); color: var(--ivory); }
body { display: grid; place-items: center; font: 16px/1.5 Cozette, ui-monospace, Consolas, monospace; }
main { max-width: 34rem; padding: 1.5rem; text-align: center; }
pre { margin: 0 0 1.25rem; color: var(--amber); font: inherit; line-height: 1.1; white-space: pre; }
h1 { margin: 0 0 .5rem; font-size: 1.5rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ivory); }
p { margin: 0 0 .75rem; color: var(--dim); }
.status { display: inline-block; margin-top: .5rem; padding: .3rem .6rem; border: 1px solid var(--rule); color: var(--holo); letter-spacing: .1em; text-transform: uppercase; }
</style>
</head>
<body>
<main>
<pre aria-hidden="true">
 ┌──────────────────────────┐
 │  DEPARTURES              │
 │  THE SHUTTLE   ·  HELD   │
 └──────────────────────────┘
</pre>
<h1>Not boarding yet</h1>
<p>The Shuttle is still being fitted out, so this Activity isn't open yet.</p>
<p>Use the Shuttle in the server as usual for now.</p>
<span class="status">Sophie · Community Services</span>
</main>
</body>
</html>
